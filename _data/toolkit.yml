# Toolkit slots shown on the Home page, written for hiring managers: plain words, one or two short sentences.
#   name        the tile label
#   tools       shown on the tile under the label (the names recruiters search for)
#   use         what the tools are for, in plain words (one short line)
#   used        what I actually did, taken from the case studies and repos
#   link        the page that backs it up; link_label is its text
# Keep "used" factual. Do not rate skill levels or invent results.

- name: Network
  tools: "Nmap, Tailscale"
  use: "Checking that a network is locked down."
  used: "I tested my home setup from outside and from inside. From outside, nothing could be reached. Inside, only my own devices could."
  link: "/projects/pihole-tailscale/"
  link_label: "Pi-hole over Tailscale"

- name: Web and code
  tools: "Nuclei, SonarQube"
  use: "Finding weak spots before an app goes live."
  used: "On the team's web app, I ran security scans and found bugs, including a misconfigured security setting (CORS). I helped fix and retest each one."
  link: "/projects/beyondreaim/"
  link_label: "BeyondReAim"

- name: Vulnerability scanning
  tools: "Nmap, Nuclei, Burp Suite, Wireshark, Metasploit"
  use: "Finding weaknesses in systems I'm allowed to test."
  used: "I used all five in a hands-on practical in my Master of Cybersecurity at Monash."
  link: "/resume/"
  link_label: "Resume"

- name: Support
  tools: "Setups, installs, guides"
  use: "Getting people working again."
  used: "I set up my team's laptops, fixed install problems, tested each version of the app and helped write the setup and troubleshooting guides."
  link: "/projects/beyondreaim/"
  link_label: "BeyondReAim"

- name: Data
  tools: "Oracle, SQL"
  use: "Loading and checking data."
  used: "On a remote internship, I loaded client data into a database, checked it through error logs and fixed SQL queries."
  link: "/resume/"
  link_label: "Resume"

- name: Secure building
  tools: "Python, FastAPI, Bandit, pip-audit"
  use: "Directing code that protects itself."
  used: "I set the requirements and reviewed DomainCheck, a website security checker that an AI assistant wrote. Automated tests and security scans guard it against misuse."
  link: "/projects/domaincheck/"
  link_label: "DomainCheck"
